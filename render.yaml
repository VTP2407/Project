services:
  # 1. Backend FastAPI Service
  - type: web
    name: diabetes-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diabetes-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: local_demo
      - key: CORS_ORIGINS
        value: "*"

  # 2. Frontend React SPA
  - type: web
    name: diabetes-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: diabetes-backend
          property: host

# 3. Free Managed PostgreSQL Database
databases:
  - name: diabetes-postgres
    databaseName: diabetes_db
    user: diabetes_user
    plan: free
