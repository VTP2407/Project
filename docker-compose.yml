version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: diabetes_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: diabetes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diabetes_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/diabetes_db
      - SECRET_KEY=super-secret-jwt-key-for-diabetes-multi-agent-system-2026
      - AI_PROVIDER=local_demo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diabetes_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

